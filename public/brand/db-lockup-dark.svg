<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" fill="none">
  <defs>
    <!-- Organic Paper/Obsidian Canvas Texture Gradient -->
    <linearGradient id="artisan-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="60%" stop-color="#0D131F"/>
      <stop offset="100%" stop-color="#06080F"/>
    </linearGradient>

    <!-- Hand-Mixed Indigo & Cobalt Watercolor Ink Flow -->
    <linearGradient id="artisan-ink" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="45%" stop-color="#FF0000"/>
      <stop offset="85%" stop-color="#00A651"/>
      <stop offset="100%" stop-color="#A8E6B0"/>
    </linearGradient>

    <!-- Expressive Titanium Calligraphy Gradient -->
    <linearGradient id="brush-titanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Natural Ink Diffuse Shadow -->
    <filter id="ink-diffuse" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Slate Artisan Card with subtle deckle edge border -->
  <rect width="800" height="240" rx="18" fill="url(#artisan-bg)"/>
  <rect width="796" height="236" x="2" y="2" rx="17" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="8 4" stroke-opacity="0.6"/>

  <!-- ==================== ARTISANAL HAND-CRAFTED ICONMARK ==================== -->
  <g transform="translate(56, 32)">
    <path d="M20 150 L125 150" stroke="#1E293B" stroke-width="1" stroke-linecap="round"/>
    <path d="M72 10 L72 165" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 6"/>
    <circle cx="72" cy="18" r="1.5" fill="#00A651" opacity="0.5"/>

    <path d="M26 36 C27 48, 25 85, 27 142 C28 148, 33 149, 36 148 C38 147, 39 140, 38 132 C37 100, 37 60, 37 34 C37 28, 31 26, 28 29 C26 31, 26 34, 26 36 Z"
          fill="#334155" opacity="0.9"/>

    <path d="M34 32 C48 30, 80 34, 102 58 C122 80, 124 108, 105 132 C88 152, 54 152, 34 146 C39 138, 42 134, 48 136 C66 140, 94 138, 106 118 C118 98, 114 74, 98 54 C82 36, 56 36, 38 40 Z"
          fill="url(#artisan-ink)" filter="url(#ink-diffuse)"/>

    <path d="M50 114 C51 114, 56 113, 58 114 C59 116, 58 145, 57 148 C54 148, 51 148, 50 148 Z" fill="#475569"/>
    <path d="M55 90 C56 90, 62 89, 64 90 C65 92, 64 146, 63 148 C60 148, 57 148, 55 148 Z" fill="#64748B"/>
    <path d="M62 64 C63 64, 69 63, 71 64 C72 66, 71 146, 70 148 C67 148, 64 148, 62 148 Z" fill="url(#brush-titanium)"/>

    <path d="M68 20 C69 17, 72 16, 73 19 C74 24, 76 68, 76 148 C73 149, 70 148, 68 147 Z" fill="#FFFFFF" filter="url(#ink-diffuse)"/>
    <circle cx="71" cy="18" r="2.8" fill="#00A651"/>
    <circle cx="71" cy="18" r="5" stroke="#00A651" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>

    <path d="M78 72 C79 72, 85 71, 87 72 C88 74, 87 146, 85 148 C83 148, 80 148, 78 148 Z" fill="url(#brush-titanium)"/>
    <path d="M85 96 C86 96, 92 95, 94 96 C95 98, 94 146, 92 148 C90 148, 87 148, 85 148 Z" fill="#475569"/>

    <path d="M18 106 C32 94, 78 88, 128 108" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 4"/>

    <path d="M12 116 C28 138, 72 152, 114 126 C136 112, 142 94, 134 82 C126 70, 108 72, 86 78 C80 80, 84 85, 90 84 C106 80, 122 80, 126 88 C130 96, 124 108, 108 118 C72 140, 32 128, 18 110 C14 106, 9 110, 12 116 Z"
          fill="url(#artisan-ink)" filter="url(#ink-diffuse)"/>
    <path d="M18 115 C34 132, 74 142, 110 120 C124 110, 130 98, 126 90" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- ==================== HUMAN TYPOGRAPHIC HARMONY ==================== -->
  <g transform="translate(224, 102)">
    <text x="0" y="0" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="6" fill="url(#brush-titanium)">DIGITAL</text>
    <text x="312" y="0" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="6" fill="url(#artisan-ink)">BURJ</text>
  </g>

  <g transform="translate(226, 124)">
    <path d="M0 0 C45 -1, 120 1, 260 0 C380 -1, 480 1, 520 0" stroke="#00A651" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
    <circle cx="260" cy="0" r="2.5" fill="#00A651"/>
  </g>

  <g transform="translate(226, 148)">
    <text x="0" y="0" font-family="'Outfit', -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="5.5" fill="#94A3B8">LEARN</text>
    <text x="74" y="-1" font-family="sans-serif" font-size="11" fill="#00A651">&#8226;</text>
    <text x="94" y="0" font-family="'Outfit', -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="5.5" fill="#94A3B8">BUILD</text>
    <text x="170" y="-1" font-family="sans-serif" font-size="11" fill="#00A651">&#8226;</text>
    <text x="190" y="0" font-family="'Outfit', -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="5.5" fill="#94A3B8">WORK</text>
    <text x="264" y="-1" font-family="sans-serif" font-size="11" fill="#00A651">&#8226;</text>
    <text x="284" y="0" font-family="'Outfit', -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="5.5" fill="#94A3B8">GROW</text>
    <text x="358" y="-1" font-family="sans-serif" font-size="11" fill="#00A651">&#8226;</text>
    <text x="378" y="0" font-family="'Outfit', -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="5.5" fill="#FF0000">GO GLOBAL</text>
  </g>

  <g transform="translate(226, 174)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" font-weight="500" fill="#64748B" letter-spacing="2.2">HUMAN CRAFT &#215; SOVEREIGN CODE &#215; TALENT MERITOCRACY</text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="400" fill="#475569" letter-spacing="0.5">The tangible bridge from foundational digital skills to real-world software venture engineering.</text>
  </g>

  <g transform="translate(642, 28)">
    <rect width="132" height="26" rx="6" fill="#0B132B" stroke="#00A651" stroke-width="0.9" stroke-opacity="0.5"/>
    <circle cx="14" cy="13" r="3" fill="#FF0000"/>
    <text x="24" y="17" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#CBD5E1" letter-spacing="1">ARTISAN EDITION</text>
  </g>
</svg>
